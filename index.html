<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>円相 | Ensō</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Noto+Sans+JP:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <!-- PWA（iPhoneの「ホーム画面に追加」でアプリ化できるように、ユーザー指示）。
         オフライン対応（Service Worker）は今回のスコープ外——ホーム画面への
         追加とスタンドアロン表示のみを目的とする。 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f2ede6" />
    <!-- iOS Safariは今もこの独自metaでしかスタンドアロン起動を認識しないため、
         標準のmobile-web-app-capableと併記する。status-bar-styleは
         black-translucentにし、既存のenv(safe-area-inset-top)によるヘッダーの
         余白計算（style.cssの.app-header参照）にステータスバー分の確保を
         任せる——アプリ側の設計と重複しないようにするため。 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="円相" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
