<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>手書き文字分割 精度検証（ローカル / KanjiCanvas）</title>
    <style>
      body {
        font-family: system-ui, "Noto Sans JP", sans-serif;
        max-width: 680px;
        margin: 24px auto;
        padding: 0 16px;
        color: #2f2a26;
      }
      h1 {
        font-size: 16px;
        margin-bottom: 4px;
      }
      p.note {
        font-size: 12px;
        color: #766f68;
        margin-top: 0;
      }
      #progress {
        font-size: 13px;
        color: #766f68;
      }
      #phrase {
        font-size: 40px;
        text-align: center;
        margin: 8px 0;
        letter-spacing: 4px;
      }
      .canvas-wrap {
        position: relative;
        width: 640px;
        height: 220px;
        margin: 0 auto;
      }
      .canvas-wrap canvas {
        position: absolute;
        top: 0;
        left: 0;
        border: 1px solid #cfc8bf;
        border-radius: 8px;
        background: #fff;
        touch-action: none;
      }
      #overlay-canvas {
        border: none !important;
        background: transparent !important;
        pointer-events: none;
      }
      .row {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin: 10px 0;
        align-items: center;
        flex-wrap: wrap;
      }
      button {
        font-size: 14px;
        padding: 8px 14px;
        border-radius: 6px;
        border: 1px solid #cfc8bf;
        background: #f5f2ee;
        cursor: pointer;
      }
      button.primary {
        background: #2f2a26;
        color: #fff;
        border-color: #2f2a26;
      }
      button.ok {
        background: #1a7a3a;
        color: #fff;
        border-color: #1a7a3a;
      }
      button.ng {
        background: #b4302a;
        color: #fff;
        border-color: #b4302a;
      }
      label.threshold {
        font-size: 12px;
        color: #766f68;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #guess {
        text-align: center;
        font-size: 20px;
        letter-spacing: 6px;
        min-height: 30px;
        margin: 6px 0;
      }
      #judge-row {
        display: none;
      }
      fieldset {
        border: 1px solid #e5e0d8;
        border-radius: 6px;
        margin: 6px auto;
        width: fit-content;
        padding: 6px 12px;
      }
      legend {
        font-size: 11px;
        color: #766f68;
      }
      #summary {
        margin-top: 20px;
        border-top: 1px solid #e5e0d8;
        padding-top: 12px;
        font-size: 13px;
      }
      #summary table {
        width: 100%;
        border-collapse: collapse;
      }
      #summary td,
      #summary th {
        text-align: left;
        padding: 2px 6px;
        border-bottom: 1px solid #eee;
      }
      textarea {
        width: 100%;
        height: 120px;
        font-size: 11px;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <h1>手書き文字分割 精度検証（ローカル・オフライン）</h1>
    <p class="note">
      境界線のない1本のキャンバスに単語を自然な続け書きで書き、ストローク同士の水平方向の間隔だけで
      文字単位に自動分割できるかを検証するページです。分割された各グループを
      KanjiCanvasで個別に認識し、結果を連結して表示します。本番のメモ機能とは独立しています。
    </p>
    <div id="progress"></div>
    <div id="phrase"></div>
    <div class="canvas-wrap">
      <canvas id="draw-canvas" width="640" height="220"></canvas>
      <canvas id="overlay-canvas" width="640" height="220"></canvas>
    </div>
    <div class="row">
      <label class="threshold">
        分割しきい値: <span id="threshold-value"></span>px
        <input type="range" id="threshold" min="0" max="150" value="40" />
      </label>
    </div>
    <div class="row">
      <button id="btn-undo">一筆取り消す</button>
      <button id="btn-clear">消去</button>
      <button id="btn-analyze" class="primary">分割＋認識してみる</button>
    </div>
    <div id="guess"></div>
    <div class="row" id="judge-row">
      <fieldset>
        <legend>分割は合っていた？</legend>
        <button id="seg-ok" class="ok">分割OK</button>
        <button id="seg-ng" class="ng">分割NG</button>
      </fieldset>
      <fieldset>
        <legend>認識結果は使えそう？</legend>
        <button id="rec-ok" class="ok">認識OK</button>
        <button id="rec-ng" class="ng">認識NG</button>
      </fieldset>
    </div>
    <div class="row" id="next-row" style="display: none">
      <button id="btn-next" class="primary">次のフレーズへ</button>
    </div>
    <div id="summary"></div>

    <canvas id="kc-work" width="256" height="256" style="display: none"></canvas>

    <script src="/vendor/kanjicanvas/kanji-canvas.js"></script>
    <script src="/vendor/kanjicanvas/ref-patterns.js"></script>
    <script src="/vendor/kanjicanvas/ref-patterns-kana.js"></script>
    <script type="module" src="/src/handwritingSegmentTest.ts"></script>
  </body>
</html>
