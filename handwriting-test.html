<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>手書き認識 精度検証（ローカル / KanjiCanvas）</title>
    <style>
      body {
        font-family: system-ui, "Noto Sans JP", sans-serif;
        max-width: 480px;
        margin: 24px auto;
        padding: 0 16px;
        color: #2f2a26;
      }
      h1 {
        font-size: 16px;
        margin-bottom: 4px;
      }
      p.note {
        font-size: 12px;
        color: #766f68;
        margin-top: 0;
      }
      #progress {
        font-size: 13px;
        color: #766f68;
      }
      #target {
        font-size: 64px;
        text-align: center;
        margin: 8px 0;
        line-height: 1;
      }
      #target .category {
        display: block;
        font-size: 12px;
        color: #766f68;
      }
      #draw-canvas {
        display: block;
        margin: 0 auto;
        border: 1px solid #cfc8bf;
        border-radius: 8px;
        background: #fff;
        touch-action: none;
      }
      .row {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin: 10px 0;
      }
      button {
        font-size: 14px;
        padding: 8px 14px;
        border-radius: 6px;
        border: 1px solid #cfc8bf;
        background: #f5f2ee;
        cursor: pointer;
      }
      button.primary {
        background: #2f2a26;
        color: #fff;
        border-color: #2f2a26;
      }
      #result {
        min-height: 60px;
        text-align: center;
        font-size: 14px;
      }
      #result .candidates {
        font-size: 22px;
        letter-spacing: 4px;
        margin: 6px 0;
      }
      #result .hit {
        color: #1a7a3a;
        font-weight: 600;
      }
      #result .miss {
        color: #b4302a;
        font-weight: 600;
      }
      #summary {
        margin-top: 20px;
        border-top: 1px solid #e5e0d8;
        padding-top: 12px;
        font-size: 13px;
      }
      #summary table {
        width: 100%;
        border-collapse: collapse;
      }
      #summary td,
      #summary th {
        text-align: left;
        padding: 2px 6px;
        border-bottom: 1px solid #eee;
      }
      textarea {
        width: 100%;
        height: 100px;
        font-size: 11px;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <h1>手書き認識 精度検証（ローカル・オフライン）</h1>
    <p class="note">
      KanjiCanvas（MIT / stroke-basedのオンデバイス認識、外部通信なし）で、ひらがな・カタカナ・常用漢字の一部を
      1文字ずつ書いて認識精度を確認する検証用ページです。本番のメモ機能とは独立しており、`npm run build`
      には含まれません（`npm run dev` で `/handwriting-test.html` を開いてください）。
    </p>
    <div id="progress"></div>
    <div id="target">
      <span class="category" id="target-category"></span>
      <span id="target-char"></span>
    </div>
    <canvas id="draw-canvas" width="256" height="256"></canvas>
    <div class="row">
      <button id="btn-undo">一筆取り消す</button>
      <button id="btn-clear">消去</button>
      <button id="btn-recognize" class="primary">判定する</button>
    </div>
    <div id="result"></div>
    <div class="row" id="next-row" style="display: none">
      <button id="btn-next" class="primary">次の文字へ</button>
    </div>
    <div id="summary"></div>

    <script src="/vendor/kanjicanvas/kanji-canvas.js"></script>
    <script src="/vendor/kanjicanvas/ref-patterns.js"></script>
    <script src="/vendor/kanjicanvas/ref-patterns-kana.js"></script>
    <script type="module" src="/src/handwritingTest.ts"></script>
  </body>
</html>
